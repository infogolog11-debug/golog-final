<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Golog · جولوج — رحلات موثوقة بين المدن</title>
<meta name="description" content="جولوج يربط السائقين والركاب بين المدن السورية والتركية برحلات موثوقة، وتوصيل طرود خفيفة، وحجز آمن يتأكد وجهاً لوجه." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #f59e0b;
    --primary-hover: #d97706;
    --bg: #fffaf2;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #10b981;
    --bad: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  .wrap { min-height: 100dvh; width: 100%; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem 1.75rem; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.08); }
  .brand { text-align: center; margin-bottom: 1.5rem; }
  .brand h1 { font-family: "Reem Kufi", sans-serif; font-size: 3rem; margin: 0 0 .5rem 0; color: var(--primary); letter-spacing: 0.5px; }
  .route-line { display: flex; align-items: center; justify-content: center; gap: .75rem; color: var(--muted); font-size: .9rem; margin-bottom: .25rem; }
  .route-line .dot { width: 8px; height: 8px; border-radius: 9999px; background: var(--primary); }
  .route-line .bar { width: 44px; height: 2px; background: repeating-linear-gradient(90deg, var(--primary) 0 6px, transparent 6px 12px); border-radius: 9999px; }
  .tagline { text-align: center; color: var(--muted); margin-bottom: 1.5rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .6rem; width: 100%; padding: .8rem 1rem; border-radius: 10px; border: 2px solid var(--border); background: #fff; color: var(--text); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all .15s ease; text-decoration: none; font-family: inherit; }
  .btn:hover { border-color: var(--primary); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-outline { }
  .btn-sm { padding: .45rem .9rem; font-size: .8rem; width: auto; }
  .divider { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .75rem; color: var(--muted); text-transform: uppercase; font-size: .7rem; letter-spacing: .08em; margin: 1.25rem 0; }
  .divider::before, .divider::after { content: ""; width: 100%; height: 1px; background: var(--border); }
  .loader { text-align: center; color: var(--muted); padding: .5rem 0; font-size: .9rem; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 9999px; animation: spin 1s linear infinite; vertical-align: -4px; margin-left: .5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { border-radius: 10px; padding: .9rem 1rem; margin-top: 1rem; font-size: .9rem; line-height: 1.6; white-space: pre-wrap; }
  .alert-good { background: rgba(16, 185, 129, .1); color: #065f46; border: 1px solid rgba(16, 185, 129, .3); }
  .alert-bad { background: rgba(239, 68, 68, .1); color: #991b1b; border: 1px solid rgba(239, 68, 68, .3); }
  .alert-warn { background: rgba(245, 158, 11, .12); color: #92400e; border: 1px solid rgba(245, 158, 11, .3); }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; padding: .7rem .85rem; border-radius: 10px; border: 1px solid var(--border); background: #fff; margin-bottom: .5rem; }
  .row.ok { border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.05); }
  .row.bad { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.05); }
  .row .label { font-weight: 600; font-size: .9rem; }
  .row .detail { color: var(--muted); font-size: .8rem; margin-top: .2rem; white-space: pre-wrap; }
  .pill { padding: .2rem .55rem; border-radius: 9999px; font-weight: 700; font-size: .7rem; white-space: nowrap; }
  .pill.ok { background: rgba(16,185,129,.2); color: #047857; }
  .pill.bad { background: rgba(239,68,68,.2); color: #b91c1c; }
  .pill.warn { background: rgba(245,158,11,.2); color: #92400e; }
  .ts { color: var(--muted); font-size: .7rem; text-align: center; margin-top: 1rem; }
  a.link { color: var(--primary); text-decoration: underline; }
  .login-box { display: flex; flex-direction: column; gap: .75rem; }
  .footnote { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 1.25rem; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .25rem; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; word-break: break-all; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <h1>Golog</h1>
        <div class="route-line">
          <span>حلب</span>
          <span class="dot"></span>
          <span class="bar"></span>
          <span class="dot"></span>
          <span>غازي عنتاب</span>
        </div>
        <div class="tagline">رفقة موثوقة على الطريق بين مدنك</div>
      </div>

      <!-- ================== منطق التوجيه ================== -->
      <!-- هذه الصفحة تعمل كـ SPA بديلة عن React إذا فشل vite build.
           ستبقى دائماً موجودة لأنها في public/index.html ضمن المستودع نفسه! -->
      <div id="app"></div>

      <div class="footnote">
        لا حاجة لكلمة سر — دخولك محمي بالكامل عبر حسابك في Google أو Telegram
      </div>
    </div>
  </div>

<script>
/* =========================================================
   منطق SPA المضمن — يعمل بدون React أو أي مكتبات خارجية
   لضمان أبداً لا نرى 404 في صفحات التطبيق (/auth, /passenger...)
   ========================================================= */

const BASE = "/api";
const CURRENT_PATH = window.location.pathname || "/";

function googleLoginUrl() {
  return BASE + "/auth/google";
}

async function fetchJson(url, opts) {
  try {
    const r = await fetch(BASE + url, Object.assign({ credentials: "include" }, opts || {}));
    let data = null;
    try { data = await r.json(); } catch (e) { data = null; }
    return { ok: r.ok, status: r.status, data: data };
  } catch (e) {
    return { ok: false, status: 0, data: null, error: e && e.message ? e.message : String(e) };
  }
}

/* استدعاء /auth/me ب 3 محاولات بإعفاء 800ms بين المحاولة والأخرى
   (نفس منطق الإصلاح في useGetMe). حتى لو فشلت أول مرة بسبب cold start
   أو تأخير تلقي الكوكي بعد 302 → المحاولات التالية ستنجح. */
async function getMeWithRetry() {
  const ATTEMPTS = 3;
  const DELAY = 800;
  let last = null;
  for (let i = 0; i < ATTEMPTS; i++) {
    const r = await fetchJson("/auth/me");
    if (r.ok && r.data && typeof (r.data.user || {}).id === "number") {
      return r.data.user;
    }
    last = r;
    if (i < ATTEMPTS - 1) await new Promise(res => setTimeout(res, DELAY));
  }
  return null;
}

function setLoading(html) {
  document.getElementById("app").innerHTML = '<div class="loader">' + html + '</div>';
}

function renderAuthPage(extraAlertHtml) {
  const params = new URLSearchParams(window.location.search || "");
  const err = params.get("error");
  const debug = params.get("debug");
  const details = params.get("details");

  let alert = "";
  if (err) {
    let msg = "فشل تسجيل الدخول عبر Google. حاول مجدداً.";
    if (err === "google_missing") msg = "تسجيل الدخول عبر Google غير مُفعَّل بعد على الخادم.";
    else if (err === "google_internal") msg = "حدث خطأ داخلي أثناء بداية تسجيل الدخول عبر Google.";
    else if (err === "google_crash") msg = "انهار مسار تسجيل الدخول قبل إكماله.";
    else if (err === "google_failed") msg = "رفضت Google المصادقة، أو انتهت صلاحية الرابط.";
    else if (err === "session_failed") msg = "تم تسجيل الدخول بنجاح لكن فشل حفظ الجلسة.";
    else if (err === "session_not_persisted") msg = "تم المصادقة لكن الجلسة لم تُحفظ في قاعدة البيانات (يُرجى تشغيل db-sync).";
    else if (err === "user_banned") msg = "هذا الحساب مُوقوف مؤقتاً. تواصل مع الإدارة.";
    const extra = debug || details;
    if (extra) msg += "\n\n🔎 تفاصيل إضافية:\n" + decodeURIComponent(extra);
    alert = '<div class="alert alert-bad">' + escapeHtml(msg) + '</div>';
  }
  if (extraAlertHtml) alert += extraAlertHtml;

  const currentDomain = window.location.hostname;
  document.getElementById("app").innerHTML = `
    ${alert}
    <div class="login-box">
      <a class="btn btn-outline" href="${googleLoginUrl()}" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
        </svg>
        <span>تسجيل الدخول عبر Google</span>
      </a>

      <div class="divider">أو</div>

      <div class="alert alert-warn" style="font-size:.8rem;margin:0">
        💡 إذا ظهرت رسالة <strong>"Bot domain invalid"</strong> بخصوص تسجيل الدخول عبر تيليجرام:
        افتح المحادثة مع <strong>@BotFather</strong> على تيليجرام وأرسل هذه الرسالة حرفياً:
        <div class="mono" style="margin-top:.4rem;padding:.5rem;background:rgba(0,0,0,.04);border-radius:6px">/setdomain ${escapeHtml(currentDomain)}</div>
        ثم اختر البوت <strong>GologApp_bot</strong> وأدخل الدومين <span class="mono">${escapeHtml(currentDomain)}</span>.
      </div>

      <div class="actions">
        <button class="btn btn-sm btn-outline" id="diagBtn">🔍 لم يعمل الدخول؟ ابدأ الفحص الذاتي السريع</button>
      </div>

      <div id="diagArea"></div>
    </div>
  `;
  document.getElementById("diagBtn").addEventListener("click", runSelfDiagnosis);
}

function renderDashboard(user) {
  const role = String(user.currentRole || "passenger").toLowerCase();
  const name = escapeHtml(user.name || "مستخدم");
  const email = escapeHtml(user.email || "");
  const photo = user.photo_url ? `<img src="${escapeAttr(user.photo_url)}" style="width:64px;height:64px;border-radius:9999px;border:2px solid var(--border)">` : "";
  const points = typeof user.loyalty_points === "number" ? user.loyalty_points : 0;
  const trips = []; /* صفحة مستقلة لاحقاً */

  document.getElementById("app").innerHTML = `
    <div class="alert alert-good">
      ✅ تم تسجيل الدخول بنجاح كـ <strong>${name}</strong> (${role === "driver" ? "سائق" : "راكب"})
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;margin:.75rem 0 .75rem 0">
      ${photo}
      <div style="flex:1">
        <div style="font-weight:700">${name}</div>
        <div style="color:var(--muted);font-size:.85rem" class="mono">${email}</div>
      </div>
      <span class="pill ${role==='driver'?'warn':'ok'}">${role==='driver' ? 'سائق' : 'راكب'}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.75rem 0 1rem 0">
      <div class="row ok">
        <div><div class="label">نقاط الولاء</div><div class="detail">${points} نقطة</div></div>
        <span class="pill ok">💎</span>
      </div>
      <div class="row ok">
        <div><div class="label">الحالة</div><div class="detail">${user.is_banned ? 'موقوف' : user.is_verified ? 'موثق' : 'قيد المراجعة'}</div></div>
        <span class="pill ${user.is_banned?'bad':'ok'}">${user.is_banned?'❌':'✅'}</span>
      </div>
    </div>
    <div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
      <a class="btn btn-outline btn-sm" href="${role === 'driver' ? '/driver' : '/passenger'}">🏠 الصفحة الرئيسية (${role === 'driver' ? 'السائق' : 'الراكب'})</a>
      <a class="btn btn-outline btn-sm" href="/profile">👤 الملف الشخصي</a>
      <a class="btn btn-outline btn-sm" href="${role === 'driver' ? '/earnings' : '/bookings'}">📒 ${role === 'driver' ? 'أرباحي' : 'حجوزاتي'}</a>
      <a class="btn btn-outline btn-sm" href="/messages">💬 الرسائل</a>
      <a class="btn btn-outline btn-sm" href="/points">🎁 نقاطي</a>
      <form action="${BASE}/auth/logout" method="post" style="margin:0;display:inline-flex;width:100%">
        <button type="submit" class="btn btn-sm btn-outline" style="width:100%">🚪 تسجيل الخروج</button>
      </form>
    </div>
  `;
}

/* ========== فحص ذاتي (مثل React auth.tsx ولكن ب vanilla JS) ========== */
async function runSelfDiagnosis() {
  const area = document.getElementById("diagArea");
  area.innerHTML = '<div class="loader">جاري الفحص الآن... يرجى الانتظار <span class="spinner"></span></div>';
  try {
    const r = await fetchJson("/debug/full-report");
    if (!r.ok || !r.data) {
      area.innerHTML = `<div class="alert alert-bad">❌ فشل الفحص الذاتي. هل API يعمل؟ التفاصيل: ${escapeHtml(r.error || "HTTP " + r.status)}</div>`;
      return;
    }
    const d = r.data;
    const summary = d.summary || "";
    const rootCause = d.rootCause || "";
    const checks = d.checks || [];

    let rows = "";
    checks.forEach(c => {
      rows += `
        <div class="row ${c.ok ? 'ok' : 'bad'}">
          <div style="flex:1">
            <div class="label">${escapeHtml(c.name)}</div>
            ${c.detail ? `<div class="detail">${escapeHtml(c.detail)}</div>` : ""}
          </div>
          <span class="pill ${c.ok ? 'ok' : 'bad'}">${escapeHtml(String(c.value))}</span>
        </div>
      `;
    });

    const alert = d.ok
      ? `<div class="alert alert-good">📋 ${escapeHtml(summary)}${rootCause ? '\n\n' + escapeHtml(rootCause) : ''}</div>`
      : `<div class="alert alert-warn">📋 ${escapeHtml(summary)}${rootCause ? '\n\n' + escapeHtml(rootCause) : ''}</div>`;

    area.innerHTML = `
      <div style="margin-top:1rem;padding:1rem;border-radius:14px;background:rgba(0,0,0,0.02);border:1px solid var(--border)">
        <p style="margin:0 0 .75rem 0;color:var(--muted);font-size:.85rem">هذا الفحص يتصل مباشرة بالخادم ويتحقق من كل طبقة بنفسه لمعرفة أين المشكلة بالضبط:</p>
        ${alert}
        <div style="margin-top:.75rem">${rows}</div>
        <div class="ts">آخر تحديث لهذا التقرير: ${escapeHtml(String(d.timestamp || ""))}</div>
      </div>
    `;
  } catch (e) {
    area.innerHTML = `<div class="alert alert-bad">❌ فشل الفحص الذاتي: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  }
}

/* =========================================================
   البداية الرئيسية:
   أولاً نتحقق من isAuthenticated عن طريق /auth/me مع 3 محاولات.
   • إن كان مسجلاً → ندخله للوحة التحكم /passenger أو /driver
     (مع ضمان الانتقال حتى لو استغرق الـ fetch بعض الوقت)
   • إن لم يكن → نعرض صفحة تسجيل الدخول مع زر Google + الفحص الذاتي.
   ========================================================= */

(async function main() {
  setLoading('جاري التحقق من الحالة الحالية... <span class="spinner"></span>');

  // تشخيص سريع: إذا كان الرابط يحتوي على ?error أو ?debug
  const params = new URLSearchParams(window.location.search || "");
  const hasErrorInUrl = params.get("error");

  const user = await getMeWithRetry();

  // ============= إعادة توجيه صريحة بناءً على الدور =============
  // نفس الإصلاح في auth.ts: لا نعتمد على React أبداً — نحطه هنا
  // في الـ HTML نفسه كـ "طبقة حماية أخيرة" لضمان أن المستخدم الذي
  // تم تسجيل دخوله فعلياً لن يبقى في صفحة الهبوط أو /auth أبداً.
  if (user) {
    const role = String(user.currentRole || "passenger").toLowerCase();
    const target = role === "driver" ? "/driver" : "/passenger";

    // حماية من الـ redirect loop: إذا وصلنا فعلياً إلى الوجهة → لا نعيد
    const here = CURRENT_PATH.replace(/\/+$/, "") || "/";
    const targetClean = target.replace(/\/+$/, "") || "/";

    // إذا كان في صفحات مُحمية غير الوجهة → نقله للوجهة الصحيحة
    const PROTECTED_ROUTES = ["/driver", "/passenger", "/admin", "/bookings", "/messages", "/profile", "/earnings", "/points", "/complete-profile", "/notifications"];
    const inProtected = PROTECTED_ROUTES.some(p => here === p || here.startsWith(p + "/"));

    if (!inProtected || here === "/" || here === "/auth") {
      // Hard redirect مع ضمانين اثنين (history + window.location)
      setLoading(`تم التعرف عليك! يتم نقلك تلقائياً إلى ${target}... <span class="spinner"></span>`);
      try { window.history.replaceState({}, "", target); } catch (e) { /* ignore */ }
      setTimeout(() => { window.location.href = target; }, 150);
      return;
    }

    // داخل لوحة محمية فعلاً: اعرض البيانات
    renderDashboard(user);
    return;
  }

  // غير مسجل الدخول → صفحة تسجيل الدخول
  let msgHtml = "";
  if (!hasErrorInUrl && CURRENT_PATH && CURRENT_PATH !== "/" && CURRENT_PATH !== "/auth") {
    // إذا كان في رابط محمي ولسه غير مسجل → نعرض له تحذيراً لطيف
    msgHtml = `<div class="alert alert-warn">الصفحة المطلوبة (<span class="mono">${escapeHtml(CURRENT_PATH)}</span>) تحتاج إلى تسجيل الدخول أولاً.</div>`;
  }
  renderAuthPage(msgHtml);
})();

/* ==================== أدوات ==================== */
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeAttr(s) { return escapeHtml(s); }
</script>
