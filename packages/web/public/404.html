<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Golog · جولوج — يتم إعادة التوجيه</title>
<meta http-equiv="refresh" content="0; url=/">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #f59e0b;
    --bg: #fffaf2;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  .wrap { min-height: 100dvh; width: 100%; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem 1.75rem; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.08); text-align: center; }
  .brand h1 { font-family: "Reem Kufi", sans-serif; font-size: 2.5rem; margin: 0 0 .5rem 0; color: var(--primary); }
  .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 9999px; animation: spin 1s linear infinite; vertical-align: -5px; margin-left: .5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted { color: var(--muted); font-size: .9rem; line-height: 1.7; margin-top: 1rem; }
  .btn { display: inline-block; margin-top: 1.25rem; padding: .7rem 1.4rem; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; font-family: inherit; }
  .route-line { display: flex; align-items: center; justify-content: center; gap: .75rem; color: var(--muted); font-size: .85rem; margin-bottom: 1.25rem; }
  .route-line .dot { width: 7px; height: 7px; border-radius: 9999px; background: var(--primary); }
  .route-line .bar { width: 40px; height: 2px; background: repeating-linear-gradient(90deg, var(--primary) 0 6px, transparent 6px 12px); border-radius: 9999px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <h1>Golog</h1>
        <div class="route-line">
          <span>حلب</span>
          <span class="dot"></span>
          <span class="bar"></span>
          <span class="dot"></span>
          <span>غازي عنتاب</span>
        </div>
      </div>
      <h2 style="margin:0 0 .25rem 0">جاري تحميل الصفحة المطلوبة...</h2>
      <p style="margin:0"><span class="spinner"></span></p>
      <p class="muted">
        إذا لم يتم تحويلك تلقائياً خلال ثانيتين، اضغط على الزر أدناه.<br>
        (يتم الآن توجيه جميع مسارات التطبيق إلى صفحة الواجهة الرئيسية)
      </p>
      <a class="btn" href="/auth">الذهاب إلى صفحة تسجيل الدخول →</a>
    </div>
  </div>
<script>
  // Hard redirect أسرع من meta refresh للـ SPA routes
  (function() {
    var target = "/";
    var here = window.location.pathname;
    // إذا كان المستخدم يحاول دخول مسار محمي → وجهه إلى /auth بدلاً من /
    var protectedRoutes = ["/passenger", "/driver", "/bookings", "/messages", "/profile", "/admin", "/notifications", "/earnings", "/points", "/complete-profile"];
    for (var i = 0; i < protectedRoutes.length; i++) {
      if (here === protectedRoutes[i] || here.indexOf(protectedRoutes[i] + "/") === 0) {
        target = "/auth";
        break;
      }
    }
    setTimeout(function() {
      window.location.replace(target);
    }, 300);
  })();
</script>
</body>
</html>
